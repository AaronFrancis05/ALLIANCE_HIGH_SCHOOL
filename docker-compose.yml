# Local development services. The Next.js + Payload app runs on the host (`pnpm dev`).
# Production on a VPS uses docker-compose.prod.yml (see docs/DEPLOYMENT-VPS.md).
name: ahsn

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ahsn
      POSTGRES_PASSWORD: ahsn_dev_pw
      POSTGRES_DB: ahsn
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ahsn -d ahsn']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Stands in for Cloudflare R2 locally.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ahsn_minio
      MINIO_ROOT_PASSWORD: ahsn_minio_dev_pw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the two buckets once. Media is publicly readable; private files are never public.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ahsn_minio ahsn_minio_dev_pw &&
      mc mb --ignore-existing local/alliance-media &&
      mc mb --ignore-existing local/alliance-private &&
      mc anonymous set download local/alliance-media &&
      mc anonymous set none local/alliance-private &&
      mc version enable local/alliance-private
      "

  # Catches every outgoing email. Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  miniodata:
